```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Vida na Fazenda</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}
canvas{
    display:block;
    image-rendering:pixelated;
}

}

    position:fixed;
    bottom:12px;

    transform:translateX(-50%);
    z-index:5;
    background:rgba(0,0,0,.7);

    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);

    display:flex;

    font-size:52px;

    margin-top:20px;

button:hover{transform:scale(1.05)}

</head>

<body>

<div id="menu">
    <h1>🌱 VIDA NA FAZENDA</h1>
    <p>Construa sua nova vida no campo!</p>
    <p>🌾 Plante • 💧 Regue • 💰 Venda • 🏡 Explore</p>
    <button onclick="startGame()">COMEÇAR</button>
</div>

<div id="hud">
    📅 Dia <span id="day">1</span><br>
    🕐 <span id="clock">06:00</span><br>
    💰 R$ <span id="money">100</span><br>
    🌱 Sementes: <span id="seeds">5</span><br>
    🥕 Colheitas: <span id="crops">0</span>
</div>

<div id="help">
    WASD = andar | E = plantar | R = regar | F = colher | G = vender
</div>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

window.addEventListener("resize",()=>{
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
});

const TILE=48;

let game=false;

let keys={};

document.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()]=true;

    if(!game)return;

    if(e.key.toLowerCase()==="e") plant();
    if(e.key.toLowerCase()==="r") water();
    if(e.key.toLowerCase()==="f") harvest();
    if(e.key.toLowerCase()==="g") sell();
});

document.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});

/* =========================
   JOGADOR
========================= */

let player={
    x:0,
    y:0,
    speed:3
};

/* =========================
   FAZENDA
========================= */

let farm=[];

const COLS=28;
const ROWS=18;

function createFarm(){

    farm=[];

    for(let y=0;y<ROWS;y++){

        farm[y]=[];

        for(let x=0;x<COLS;x++){

            let type="grass";

            /*
            área de água
            */

            if(x>=22 && y>=2 && y<=7){
                type="water";
            }

            /*
            casa
            */

            if(x>=2 && x<=6 && y>=2 && y<=5){
                type="house";
            }

            /*
            terra de plantação
            */

            if(x>=8 && x<=15 && y>=5 && y<=10){
                type="soil";
            }

            /*
            caminho
            */

            if(y===12 && x>=2 && x<=20){
                type="path";
            }

            /*
            árvores
            */

            if(
                Math.random()<0.07 &&
                type==="grass" &&
                x>1 &&
                x<21
            ){
                type="tree";
            }

            farm[y][x]={
                type:type,
                crop:null,
                watered:false
            };
        }
    }
}

/* =========================
   PLANTAS
========================= */

function plant(){

    let t=getPlayerTile();

    if(!t)return;

    if(
        t.type==="soil" &&
        !t.crop &&
        seeds>0
    ){

        t.crop={
            stage:1,
            watered:false
        };

        seeds--;

        updateHUD();
    }
}

function water(){

    let t=getPlayerTile();

    if(!t)return;

    if(t.crop){

        t.watered=true;
        t.crop.watered=true;

        updateHUD();
    }
}

function harvest(){

    let t=getPlayerTile();

    if(!t || !t.crop)return;

    if(t.crop.stage>=3){

        t.crop=null;

        crops++;

        updateHUD();
    }
}

/* =========================
   VENDA
========================= */

function sell(){

    if(crops<=0)return;

    money+=crops*25;
    crops=0;

    updateHUD();
}

/* =========================
   TEMPO
========================= */

let day=1;
let hour=6;
let minute=0;

let seeds=5;
let crops=0;
let money=100;

let lastTime=Date.now();

function updateTime(){

    let now=Date.now();

    if(now-lastTime>1000){

        minute+=10;

        if(minute>=60){

            minute=0;
            hour++;
        }

        /*
        fim do dia
        */

        if(hour>=22){

            nextDay();
        }

        lastTime=now;

        updateHUD();
    }
}

function nextDay(){

    day++;
    hour=6;
    minute=0;

    /*
    crescimento das plantações
    */

    for(let y=0;y<ROWS;y++){

        for(let x=0;x<COLS;x++){

            let t=farm[y][x];

            if(t.crop){

                if(t.watered){

                    t.crop.stage++;

                    if(t.crop.stage>3){
                        t.crop.stage=3;
                    }

                }

                t.watered=false;
            }
        }
    }

    /*
    ganha algumas sementes
    */

    seeds+=2;

    updateHUD();
}

/* =========================
   TILE DO JOGADOR
========================= */

function getPlayerTile(){

    let tx=Math.floor(player.x/TILE);
    let ty=Math.floor(player.y/TILE);

    if(
        tx<0||
        ty<0||
        tx>=COLS||
        ty>=ROWS
    )return null;

    return farm[ty][tx];
}

/* =========================
   MOVIMENTO
========================= */

function movement(){

    let nx=player.x;
    let ny=player.y;

    if(keys["w"]||keys["arrowup"])
        ny-=player.speed;

    if(keys["s"]||keys["arrowdown"])
        ny+=player.speed;

    if(keys["a"]||keys["arrowleft"])
        nx-=player.speed;

    if(keys["d"]||keys["arrowright"])
        nx+=player.speed;

    nx=Math.max(15,Math.min(COLS*TILE-15,nx));
    ny=Math.max(15,Math.min(ROWS*TILE-15,ny));

    let tx=Math.floor(nx/TILE);
    let ty=Math.floor(ny/TILE);

    /*
    impede entrar na água
    */

    if(farm[ty][tx].type!=="water"){

        /*
        impede entrar na casa
        */

        if(farm[ty][tx].type!=="house"){

            player.x=nx;
            player.y=ny;
        }
    }
}

/* =========================
   DESENHAR MUNDO
========================= */

function drawWorld(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    /*
    câmera centralizada
    */

    let camX=player.x-canvas.width/2;
    let camY=player.y-canvas.height/2;

    camX=Math.max(
        0,
        Math.min(
            COLS*TILE-canvas.width,
            camX
        )
    );

    camY=Math.max(
        0,
        Math.min(
            ROWS*TILE-canvas.height,
            camY
        )
    );

    ctx.save();

    ctx.translate(-camX,-camY);

    /*
    tiles
    */

    for(let y=0;y<ROWS;y++){

        for(let x=0;x<COLS;x++){

            let t=farm[y][x];

            let px=x*TILE;
            let py=y*TILE;

            /*
            GRAMA
            */

            if(t.type==="grass"){

                ctx.fillStyle="#68a94b";

                ctx.fillRect(
                    px,
                    py,
                    TILE,
                    TILE
                );

                /*
                pequenos detalhes
                */

                ctx.fillStyle="#5d9844";

                ctx.fillRect(
                    px+10,
                    py+12,
                    3,
                    3
                );

                ctx.fillRect(
                    px+32,
                    py+30,
                    3,
                    3
                );
            }

            /*
            ÁGUA
            */

            if(t.type==="water"){

                ctx.fillStyle="#4a9ed1";

                ctx.fillRect(
                    px,
                    py,
                    TILE,
                    TILE
                );

                ctx.strokeStyle="#76c5e8";

                ctx.beginPath();

                ctx.moveTo(px+5,py+20);
                ctx.lineTo(px+25,py+20);
                ctx.lineTo(px+35,py+14);

                ctx.stroke();
            }

            /*
            TERRA
            */

            if(t.type==="soil"){

                ctx.fillStyle="#8a5a36";

                ctx.fillRect(
                    px,
                    py,
                    TILE,
                    TILE
                );

                ctx.strokeStyle="#674329";

                for(let i=8;i<TILE;i+=12){

                    ctx.beginPath();

                    ctx.moveTo(px+i,py);
                    ctx.lineTo(px+i,py+TILE);

                    ctx.stroke();
                }
            }

            /*
            CAMINHO
            */

            if(t.type==="path"){

                ctx.fillStyle="#c59b61";

                ctx.fillRect(
                    px,
                    py,
                    TILE,
                    TILE
                );
            }

            /*
            CASA
            */

            if(t.type==="house"){

                ctx.fillStyle="#d7b37a";

                ctx.fillRect(
                    px,
                    py,
                    TILE,
                    TILE
                );

                ctx.fillStyle="#9d4637";

                ctx.fillRect(
                    px,
                    py,
                    TILE,
                    14
                );

                /*
                janela
                */

                if(x===3&&y===3){

                    ctx.fillStyle="#6bb8d6";

                    ctx.fillRect(
                        px+12,
                        py+15,
                        24,
                        20
                    );
                }
            }

            /*
            ÁRVORE
            */

            if(t.type==="tree"){

                ctx.fillStyle="#71452d";

                ctx.fillRect(
                    px+19,
                    py+22,
                    10,
                    26
                );

                ctx.fillStyle="#34733b";

                ctx.beginPath();

                ctx.arc(
                    px+24,
                    py+20,
                    21,
                    0,
                    Math.PI*2
                );

                ctx.fill();

                ctx.fillStyle="#438747";

                ctx.beginPath();

                ctx.arc(
                    px+13,
                    py+13,
                    13,
                    0,
                    Math.PI*2
                );

                ctx.fill();
            }

            /*
            PLANTAÇÃO
            */

            if(t.crop){

                let cx=px+24;
                let cy=py+25;

                if(t.crop.stage===1){

                    ctx.fillStyle="#4c8d32";

                    ctx.fillRect(
                        cx-3,
                        cy-5,
                        6,
                        12
                    );
                }

                if(t.crop.stage===2){

                    ctx.fillStyle="#388b35";

                    ctx.beginPath();

                    ctx.arc(
                        cx,
                        cy,
                        11,
                        0,
                        Math.PI*2
                    );

                    ctx.fill();
                }

                if(t.crop.stage>=3){

                    ctx.fillStyle="#e89b32";

                    ctx.beginPath();

                    ctx.arc(
                        cx,
                        cy,
                        13,
                        0,
                        Math.PI*2
                    );

                    ctx.fill();

                    ctx.fillStyle="#55a63e";

                    ctx.fillRect(
                        cx-3,
                        cy-19,
                        6,
                        9
                    );
                }

                /*
                planta regada
                */

                if(t.watered){

                    ctx.fillStyle="#69c7ff";

                    ctx.beginPath();

                    ctx.arc(
                        px+8,
                        py+8,
                        3,
                        0,
                        Math.PI*2
                    );

                    ctx.fill();
                }
            }
        }
    }

    /*
    JOGADOR
    */

    ctx.fillStyle="#3159a8";

    ctx.fillRect(
        player.x-14,
        player.y-17,
        28,
        32
    );

    /*
    cabeça
    */

    ctx.fillStyle="#f0b37e";

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y-19,
        11,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
    cabelo
    */

    ctx.fillStyle="#4a2b1c";

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y-24,
        11,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();

    /*
    pernas
    */

    ctx.fillStyle="#333";

    ctx.fillRect(
        player.x-10,
        player.y+14,
        8,
        10
    );

    ctx.fillRect(
        player.x+2,
        player.y+14,
        8,
        10
    );

    ctx.restore();
}

/* =========================
   HUD
========================= */

function updateHUD(){

    document.getElementById("day").textContent=day;

    let h=String(hour).padStart(2,"0");
    let m=String(minute).padStart(2,"0");

    document.getElementById("clock").textContent=
        h+":"+m;

    document.getElementById("money").textContent=money;
    document.getElementById("seeds").textContent=seeds;
    document.getElementById("crops").textContent=crops;
}

/* =========================
   LOOP
========================= */

function loop(){

    if(game){

        movement();
        updateTime();
        drawWorld();

    }

    requestAnimationFrame(loop);
}

/* =========================
   COMEÇAR
========================= */

function startGame(){

    document.getElementById("menu").style.display="none";

    createFarm();

    player.x=4*TILE;
    player.y=8*TILE;

    game=true;

    updateHUD();
}

loop();

</script>

</body>
</html>
