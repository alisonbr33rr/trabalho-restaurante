```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuja dos Zumbis</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #111;
    overflow: hidden;
    font-family: Arial, sans-serif;
    user-select: none;
}

canvas {
    display: block;
    background: #1c2a22;
}

#menu,
#gameOver {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    z-index: 10;
    text-align: center;
}

#gameOver {
    display: none;
}

h1 {
    font-size: 55px;
    color: #7cff4f;
    margin-bottom: 10px;
    text-shadow: 0 0 15px #36ff00;
}

h2 {
    font-size: 45px;
    color: #ff4444;
    margin-bottom: 10px;
}

p {
    font-size: 18px;
    margin: 8px;
    color: #ddd;
}

button {
    margin-top: 25px;
    padding: 15px 40px;
    font-size: 20px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    background: #65e638;
    color: #10200b;
    cursor: pointer;
}

button:hover {
    transform: scale(1.05);
    background: #82ff58;
}

#hud {
    position: fixed;
    top: 15px;
    left: 15px;
    color: white;
    font-size: 20px;
    z-index: 5;
    display: none;
    text-shadow: 2px 2px 3px black;
}

#healthBar {
    width: 200px;
    height: 20px;
    border: 2px solid white;
    margin-top: 5px;

    width: 100%;
    height: 100%;
    background: #32e639;

</style>
</head>

<body>

<div id="menu">
    <h1>FUJA DOS ZUMBIS</h1>

    <p>🧟 Sobreviva o máximo que conseguir!</p>
    <p>⌨️ WASD = movimentar</p>
    <p>🖱️ Mouse = mirar e atirar</p>

    <button onclick="startGame()">JOGAR</button>
</div>

<div id="gameOver">
    <h2>VOCÊ MORREU 💀</h2>

    <p id="finalScore"></p>
    <p id="finalKills"></p>

    <button onclick="startGame()">JOGAR NOVAMENTE</button>
</div>

<div id="hud">
    ❤️ VIDA
    <div id="healthBar">
        <div id="health"></div>
    </div>

    <div>🏆 Pontos: <span id="score">0</span></div>
    <div>🧟 Mortes: <span id="kills">0</span></div>
    <div>⏱️ Tempo: <span id="time">0</span></div>
</div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

let gameRunning = false;

let keys = {};

let mouse = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    down: false
};

document.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

canvas.addEventListener("mousemove", e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

canvas.addEventListener("mousedown", () => {
    mouse.down = true;
});

canvas.addEventListener("mouseup", () => {
    mouse.down = false;
});

let player;
let bullets = [];
let zombies = [];

let score = 0;
let kills = 0;
let survivalTime = 0;

let lastSpawn = 0;
let lastShot = 0;
let startTime = 0;

function startGame() {

    document.getElementById("menu").style.display = "none";
    document.getElementById("gameOver").style.display = "none";
    document.getElementById("hud").style.display = "block";

    player = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        size: 22,
        speed: 4,
        health: 100
    };

    bullets = [];
    zombies = [];

    score = 0;
    kills = 0;
    survivalTime = 0;

    startTime = Date.now();

    gameRunning = true;

    update();
}

function spawnZombie() {

    let side = Math.floor(Math.random() * 4);

    let x;
    let y;

    if (side === 0) {
        x = Math.random() * canvas.width;
        y = -40;
    }

    if (side === 1) {
        x = canvas.width + 40;
        y = Math.random() * canvas.height;
    }

    if (side === 2) {
        x = Math.random() * canvas.width;
        y = canvas.height + 40;
    }

    if (side === 3) {
        x = -40;
        y = Math.random() * canvas.height;
    }

    zombies.push({
        x: x,
        y: y,
        size: 22,
        speed: 1 + Math.random() * 0.8 + survivalTime / 100,
        health: 1
    });
}

function shoot() {

    let angle = Math.atan2(
        mouse.y - player.y,
        mouse.x - player.x
    );

    bullets.push({
        x: player.x,
        y: player.y,
        dx: Math.cos(angle) * 10,
        dy: Math.sin(angle) * 10,
        size: 5
    });
}

function update() {

    if (!gameRunning) return;

    let now = Date.now();

    survivalTime = Math.floor((now - startTime) / 1000);

    /*
    MOVIMENTO
    */

    if (keys["w"] || keys["arrowup"]) {
        player.y -= player.speed;
    }

    if (keys["s"] || keys["arrowdown"]) {
        player.y += player.speed;
    }

    if (keys["a"] || keys["arrowleft"]) {
        player.x -= player.speed;
    }

    if (keys["d"] || keys["arrowright"]) {
        player.x += player.speed;
    }

    player.x = Math.max(player.size, Math.min(canvas.width - player.size, player.x));
    player.y = Math.max(player.size, Math.min(canvas.height - player.size, player.y));

    /*
    TIRO
    */

    if (mouse.down && now - lastShot > 180) {
        shoot();
        lastShot = now;
    }

    /*
    BALAS
    */

    for (let i = bullets.length - 1; i >= 0; i--) {

        let b = bullets[i];

        b.x += b.dx;
        b.y += b.dy;

        if (
            b.x < -20 ||
            b.x > canvas.width + 20 ||
            b.y < -20 ||
            b.y > canvas.height + 20
        ) {
            bullets.splice(i, 1);
            continue;
        }

        /*
        COLISÃO COM ZUMBI
        */

        for (let j = zombies.length - 1; j >= 0; j--) {

            let z = zombies[j];

            let distance = Math.hypot(
                b.x - z.x,
                b.y - z.y
            );

            if (distance < z.size + b.size) {

                z.health--;

                bullets.splice(i, 1);

                if (z.health <= 0) {

                    zombies.splice(j, 1);

                    kills++;
                    score += 10;
                }

                break;
            }
        }
    }

    /*
    SPAWN DOS ZUMBIS
    */

    let spawnDelay = Math.max(
        300,
        1200 - survivalTime * 15
    );

    if (now - lastSpawn > spawnDelay) {

        spawnZombie();

        lastSpawn = now;
    }

    /*
    ZUMBIS
    */

    for (let i = zombies.length - 1; i >= 0; i--) {

        let z = zombies[i];

        let angle = Math.atan2(
            player.y - z.y,
            player.x - z.x
        );

        z.x += Math.cos(angle) * z.speed;
        z.y += Math.sin(angle) * z.speed;

        let distance = Math.hypot(
            player.x - z.x,
            player.y - z.y
        );

        if (distance < player.size + z.size) {

            player.health -= 0.4;

            /*
            Empurra o zumbi para evitar
            que fique preso dentro do jogador.
            */

            z.x -= Math.cos(angle) * 3;
            z.y -= Math.sin(angle) * 3;

            if (player.health <= 0) {
                endGame();
            }
        }
    }

    /*
    HUD
    */

    document.getElementById("score").textContent = score;
    document.getElementById("kills").textContent = kills;
    document.getElementById("time").textContent = survivalTime;

    document.getElementById("health").style.width =
        Math.max(0, player.health) + "%";

    draw();

    requestAnimationFrame(update);
}

function draw() {

    /*
    FUNDO
    */

    ctx.fillStyle = "#18251d";
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    /*
    GRID DO CHÃO
    */

    ctx.strokeStyle = "rgba(255,255,255,0.04)";
    ctx.lineWidth = 1;

    let grid = 50;

    for (let x = 0; x < canvas.width; x += grid) {

        ctx.beginPath();

        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);

        ctx.stroke();
    }

    for (let y = 0; y < canvas.height; y += grid) {

        ctx.beginPath();

        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);

        ctx.stroke();
    }

    /*
    BALAS
    */

    for (let b of bullets) {

        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            b.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "#ffe600";
        ctx.fill();
    }

    /*
    ZUMBIS
    */

    for (let z of zombies) {

        /*
        corpo
        */

        ctx.beginPath();

        ctx.arc(
            z.x,
            z.y,
            z.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "#5ca653";
        ctx.fill();

        /*
        olhos
        */

        ctx.fillStyle = "white";

        ctx.beginPath();

        ctx.arc(
            z.x - 7,
            z.y - 5,
            4,
            0,
            Math.PI * 2
        );

        ctx.arc(
            z.x + 7,
            z.y - 5,
            4,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.fillStyle = "#111";

        ctx.beginPath();

        ctx.arc(
            z.x - 7,
            z.y - 5,
            2,
            0,
            Math.PI * 2
        );

        ctx.arc(
            z.x + 7,
            z.y - 5,
            2,
            0,
            Math.PI * 2
        );

        ctx.fill();

        /*
        boca
        */

        ctx.strokeStyle = "#111";
        ctx.lineWidth = 3;

        ctx.beginPath();

        ctx.arc(
            z.x,
            z.y + 5,
            8,
            0,
            Math.PI
        );

        ctx.stroke();
    }

    /*
    JOGADOR
    */

    let angle = Math.atan2(
        mouse.y - player.y,
        mouse.x - player.x
    );

    /*
    corpo
    */

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y,
        player.size,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#4ca9ff";
    ctx.fill();

    /*
    arma
    */

    ctx.save();

    ctx.translate(
        player.x,
        player.y
    );

    ctx.rotate(angle);

    ctx.fillStyle = "#333";

    ctx.fillRect(
        5,
        -5,
        28,
        10
    );

    ctx.restore();

    /*
    olho
    */

    ctx.fillStyle = "white";

    ctx.beginPath();

    ctx.arc(
        player.x + Math.cos(angle) * 8,
        player.y + Math.sin(angle) * 8,
        5,
        0,
        Math.PI * 2
    );

    ctx.fill();
}

function endGame() {

    gameRunning = false;

    document.getElementById("hud").style.display = "none";

    document.getElementById("gameOver").style.display = "flex";

    document.getElementById("finalScore").textContent =
        "🏆 Pontuação: " + score;

    document.getElementById("finalKills").textContent =
        "🧟 Zumbis eliminados: " + kills;
}

</script>

</body>
</html>
