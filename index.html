<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vale Verde</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
}

canvas{
  display:block;
  width:100vw;
  height:100vh;
  image-rendering:pixelated;
}

#menu{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;
  background:
    linear-gradient(#234b31cc,#0b1b11ee),
    #5d9654;
}

#menu h1{
  font-size:64px;
  color:#f0d47c;
  text-shadow:5px 5px #453522;
  margin-bottom:5px;
}

#menu p{
  color:#e5edcf;
  margin-bottom:25px;
  font-size:18px;
}

button{
  cursor:pointer;
  border:3px solid #594329;
  background:#d8ae67;
  color:#30251a;
  border-radius:7px;
  padding:12px 28px;
  margin:5px;
  font-weight:bold;
  font-size:16px;
  box-shadow:0 4px #3d2b1c;
}

button:active{
  transform:translateY(3px);
  box-shadow:0 1px #3d2b1c;
}

#hud{
  position:fixed;
  left:12px;
  top:12px;
  z-index:5;
  width:225px;
  background:#29251fde;
  color:white;
  border:3px solid #76634a;
  border-radius:9px;
  padding:10px;
  font-size:13px;
  line-height:1.5;
}

.gold{
  color:#efd27d;
}

.bar{
  height:10px;
  background:#111;
  border:1px solid #000;
  margin:2px 0 5px;
}

.bar div{
  height:100%;
}

#energy{
  background:#e6c84f;
  width:100%;
}

#water{
  background:#55a9d2;
  width:100%;
}

#controls{
  position:fixed;
  right:12px;
  bottom:12px;
  z-index:5;
  background:#29251fde;
  color:#eee;
  border:2px solid #6c604e;
  border-radius:7px;
  padding:8px;
  font-size:11px;
  line-height:1.45;
}

#inventory{
  position:fixed;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:4px;
  background:#29251fee;
  border:3px solid #76644b;
  border-radius:8px;
  padding:6px;
  z-index:5;
}

.slot{
  position:relative;
  width:55px;
  height:55px;
  background:#454035;
  border:3px solid #756b58;
  border-radius:5px;
  display:grid;
  place-items:center;
  font-size:28px;
}

.slot.sel{
  border-color:#ffe77b;
  box-shadow:0 0 10px #ffe77b;
}

.slot small{
  position:absolute;
  right:3px;
  bottom:0;
  color:white;
  text-shadow:2px 2px #000;
}

#dialog{
  display:none;
  position:fixed;
  left:50%;
  bottom:92px;
  transform:translateX(-50%);
  width:min(720px,90%);
  background:#29251fee;
  color:#fff;
  border:4px solid #b99a62;
  border-radius:8px;
  padding:14px;
  z-index:10;
}

#dialogName{
  color:#f0d17d;
  font-size:18px;
  font-weight:bold;
}

#dialogText{
  margin-top:5px;
  line-height:1.5;
}

#toast{
  display:none;
  position:fixed;
  top:16px;
  left:50%;
  transform:translateX(-50%);
  background:#211f1de8;
  color:#fff;
  border:2px solid #b2955e;
  border-radius:6px;
  padding:8px 15px;
  z-index:30;
}
</style>
</head>

<body>

<div id="menu">
  <h1>VALE VERDE</h1>
  <p>Uma pequena fazenda, um grande mundo.</p>

  <button onclick="newGame()">🌱 NOVO JOGO</button>
  <button onclick="loadGame()">💾 CARREGAR</button>
</div>

<div id="hud">

  <div class="gold">
    <b>🌿 VALE VERDE</b>
  </div>

  📅 Dia <b id="day">1</b>
  · 🕐 <b id="clock">06:00</b>
  <br>

  <span id="weather">☀️ Ensolarado</span>
  <br>

  💰 R$ <b id="money">100</b>

  <br>

  ⚡ Energia

  <div class="bar">
    <div id="energy"></div>
  </div>

  💧 Água

  <div class="bar">
    <div id="water"></div>
  </div>

  🌱 Sementes <b id="seeds">8</b>
  · 🥕 <b id="crops">0</b>
  · 🐟 <b id="fish">0</b>

</div>

<div id="inventory">

  <div class="slot sel" id="s0">
    🌱
    <small>8</small>
  </div>

  <div class="slot" id="s1">
    🥕
    <small>0</small>
  </div>

  <div class="slot" id="s2">
    💧
  </div>

  <div class="slot" id="s3">
    ⛏️
  </div>

  <div class="slot" id="s4">
    🪓
  </div>

  <div class="slot" id="s5">
    🎣
    <small>0</small>
  </div>

</div>

<div id="controls">

  <b>CONTROLES</b>
  <br>

  WASD / SETAS — andar
  <br>

  E — interagir / plantar / pescar
  <br>

  R — regar
  <br>

  F — colher
  <br>

  G — vender
  <br>

  1–6 — selecionar
  <br>

  P — salvar

</div>

<div id="dialog">

  <div id="dialogName"></div>

  <div id="dialogText"></div>

  <button onclick="closeDialog()">OK</button>

</div>

<div id="toast"></div>

<canvas id="game"></canvas>

<script>

/* =========================================================
   VALE VERDE V4
   Tudo em um único HTML
========================================================= */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const WIDTH=480;
const HEIGHT=270;

const TILE=16;

const MAP_WIDTH=120;
const MAP_HEIGHT=80;

canvas.width=WIDTH;
canvas.height=HEIGHT;

let playing=false;

let map=[];

let day=1;
let hour=6;
let minute=0;

let money=100;
let seeds=8;
let crops=0;
let fish=0;

let energy=100;
let water=100;

let weather="sun";

let selected=0;

let tick=0;

let lastTime=Date.now();

let camera={
  x:0,
  y:0
};

let player={
  x:14*TILE,
  y:27*TILE,
  dir:"down",
  walk:false,
  frame:0
};

let keys={};

let npcs=[];
let animals=[];
let particles=[];


/* =========================================================
   CONTROLES
========================================================= */

document.addEventListener("keydown",function(e){

  keys[e.key.toLowerCase()]=true;

  if(!playing)return;

  const k=e.key.toLowerCase();

  if(k>="1" && k<="6"){
    select(Number(k)-1);
  }

  if(k==="e"){
    interact();
  }

  if(k==="r"){
    waterPlant();
  }

  if(k==="f"){
    harvest();
  }

  if(k==="g"){
    sell();
  }

  if(k==="p"){
    saveGame();
  }

  if(k==="escape"){
    closeDialog();
  }

});


document.addEventListener("keyup",function(e){

  keys[e.key.toLowerCase()]=false;

});


/* =========================================================
   CRIAÇÃO DO MUNDO
========================================================= */

function createTile(type="grass"){

  return{
    type:type,
    variant:Math.floor(Math.random()*4),
    crop:null,
    watered:false
  };

}


function buildWorld(){

  map=[];

  for(let y=0;y<MAP_HEIGHT;y++){

    map[y]=[];

    for(let x=0;x<MAP_WIDTH;x++){

      map[y][x]=createTile();

    }

  }


  /*
    LAGO
  */

  for(let y=4;y<=17;y++){

    for(let x=69;x<=83;x++){

      map[y][x].type="water";

    }

  }


  /*
    RIO
  */

  for(let y=0;y<MAP_HEIGHT;y++){

    map[y][58].type="water";
    map[y][59].type="water";

  }


  /*
    ESTRADA
  */

  for(let x=0;x<MAP_WIDTH;x++){

    map[23][x].type="path";
    map[24][x].type="path";

  }


  for(let y=0;y<MAP_HEIGHT;y++){

    map[y][34].type="path";
    map[y][35].type="path";

  }


  /*
    FLORESTA
  */

  for(let y=2;y<20;y++){

    for(let x=42;x<57;x++){

      if(Math.random()<0.40){

        map[y][x].type="tree";

      }

    }

  }


  /*
    ROCHAS E FLORES
  */

  for(let y=0;y<MAP_HEIGHT;y++){

    for(let x=0;x<MAP_WIDTH;x++){

      if(map[y][x].type==="grass"){

        const r=Math.random();

        if(r<0.025){

          map[y][x].type="rock";

        }

        else if(r<0.06){

          map[y][x].type="flower";

        }

      }

    }

  }


  /*
    FAZENDA
  */

  for(let y=18;y<=34;y++){

    for(let x=6;x<=27;x++){

      map[y][x]=createTile("soil");

    }

  }


  /*
    CASA
  */

  for(let y=36;y<=43;y++){

    for(let x=8;x<=17;x++){

      map[y][x]=createTile("house");

    }

  }


  map[36][12]=createTile("door");


  /*
    NPCS
  */

  npcs=[

    {
      name:"Lia",
      x:44*TILE,
      y:22*TILE,
      shirt:"#c76c89",
      hair:"#57362a",

      lines:[
        "O Vale Verde fica lindo no fim da tarde.",
        "Cuide bem das suas plantações!",
        "O lago é ótimo para pescar."
      ]

    },

    {
      name:"Theo",
      x:49*TILE,
      y:27*TILE,
      shirt:"#5b7ec4",
      hair:"#35251f",

      lines:[
        "Dizem que existe um peixe enorme no lago.",
        "Pesque de manhã para ter mais sorte.",
        "Se quiser dinheiro, venda seus peixes."
      ]

    },

    {
      name:"Rosa",
      x:40*TILE,
      y:28*TILE,
      shirt:"#9367ba",
      hair:"#503225",

      lines:[
        "A cidade sempre tem alguma novidade.",
        "Plante bastante antes da chuva.",
        "Uma boa fazenda começa com paciência."
      ]

    }

  ];


  /*
    ANIMAIS
  */

  animals=[

    {
      type:"chicken",
      x:19*TILE,
      y:38*TILE,
      d:1,
      t:0
    },

    {
      type:"chicken",
      x:23*TILE,
      y:40*TILE,
      d:-1,
      t:50
    },

    {
      type:"cow",
      x:27*TILE,
      y:39*TILE,
      d:1,
      t:100
    }

  ];

}


/* =========================================================
   COLISÃO
========================================================= */

function canWalk(px,py){

  for(let dy=-5;dy<=5;dy+=10){

    for(let dx=-5;dx<=5;dx+=10){

      const tx=Math.floor((px+dx)/TILE);
      const ty=Math.floor((py+dy)/TILE);

      if(
        tx<0 ||
        ty<0 ||
        tx>=MAP_WIDTH ||
        ty>=MAP_HEIGHT
      ){

        return false;

      }


      const type=map[ty][tx].type;


      if(
        type==="water" ||
        type==="tree" ||
        type==="rock" ||
        type==="house"
      ){

        return false;

      }

    }

  }

  return true;

}


/* =========================================================
   PLAYER
========================================================= */

function updatePlayer(){

  let dx=0;
  let dy=0;


  if(keys.w || keys.arrowup){
    dy--;
  }

  if(keys.s || keys.arrowdown){
    dy++;
  }

  if(keys.a || keys.arrowleft){
    dx--;
  }

  if(keys.d || keys.arrowright){
    dx++;
  }


  player.walk=Boolean(dx||dy);


  if(dx && dy){

    dx*=0.707;
    dy*=0.707;

  }


  if(dx<0)player.dir="left";
  if(dx>0)player.dir="right";
  if(dy<0)player.dir="up";
  if(dy>0)player.dir="down";


  if(player.walk){

    player.frame+=0.18;

    const speed=energy>0 ? 1.35 : 0.45;

    const nx=player.x+dx*speed;
    const ny=player.y+dy*speed;


    if(canWalk(nx,ny)){

      player.x=nx;
      player.y=ny;

      energy=Math.max(
        0,
        energy-0.008
      );

    }

  }

}


/* =========================================================
   TILE À FRENTE
========================================================= */

function frontTile(){

  let px=player.x;
  let py=player.y;


  if(player.dir==="up")py-=15;
  if(player.dir==="down")py+=15;
  if(player.dir==="left")px-=15;
  if(player.dir==="right")px+=15;


  const tx=Math.floor(px/TILE);
  const ty=Math.floor(py/TILE);


  if(
    tx>=0 &&
    ty>=0 &&
    tx<MAP_WIDTH &&
    ty<MAP_HEIGHT
  ){

    return map[ty][tx];

  }


  return null;

}


/* =========================================================
   INTERAÇÃO
========================================================= */

function interact(){

  /*
    NPC
  */

  for(const npc of npcs){

    if(
      Math.hypot(
        player.x-npc.x,
        player.y-npc.y
      )<22
    ){

      talk(npc);
      return;

    }

  }


  const tile=frontTile();

  if(!tile)return;


  /*
    PESCA
  */

  if(tile.type==="water"){

    fishNow();

    return;

  }


  /*
    PLANTAR
  */

  if(
    tile.type==="soil" &&
    !tile.crop
  ){

    if(seeds<=0){

      toast("Você não tem sementes.");

      return;

    }


    if(energy<4){

      toast("Você está cansado.");

      return;

    }


    tile.crop={
      stage:1,
      growth:0
    };


    seeds--;
    energy-=4;

    particle(
      player.x,
      player.y,
      "🌱"
    );

    toast("Semente plantada!");

  }

}


/* =========================================================
   REGAR
========================================================= */

function waterPlant(){

  const tile=frontTile();


  if(
    !tile ||
    !tile.crop
  ){

    toast("Não há planta aqui.");

    return;

  }


  if(water<=0){

    toast("Seu regador está vazio.");

    return;

  }


  if(energy<2){

    toast("Você está cansado.");

    return;

  }


  tile.watered=true;

  water-=8;

  energy-=2;

  particle(
    player.x,
    player.y,
    "💧"
  );

  toast("Plantação regada!");

}


/* =========================================================
   COLHEITA
========================================================= */

function harvest(){

  const tile=frontTile();


  if(
    !tile ||
    !tile.crop
  ){

    return;

  }


  if(tile.crop.stage<3){

    toast("Essa planta ainda não cresceu.");

    return;

  }


  tile.crop=null;

  crops++;

  energy=Math.max(
    0,
    energy-3
  );

  particle(
    player.x,
    player.y,
    "🥕"
  );

  toast("Você colheu uma cenoura!");

}


/* =========================================================
   PESCA
========================================================= */

function fishNow(){

  if(energy<7){

    toast("Você está cansado.");

    return;

  }


  energy-=7;


  if(Math.random()<0.75){

    fish++;

    particle(
      player.x,
      player.y,
      "🐟"
    );

    toast("Você pescou um peixe!");

  }

  else{

    toast("O peixe escapou!");

  }

}


/* =========================================================
   VENDA
========================================================= */

function sell(){

  const value=
    crops*25+
    fish*20;


  if(value<=0){

    toast("Você não tem nada para vender.");

    return;

  }


  money+=value;

  crops=0;
  fish=0;


  toast(
    "Você vendeu tudo por R$ "+value+"!"
  );

}


/* =========================================================
   NPC
========================================================= */

function talk(npc){

  document.getElementById(
    "dialog"
  ).style.display="block";


  document.getElementById(
    "dialogName"
  ).textContent=npc.name;


  document.getElementById(
    "dialogText"
  ).textContent=
    npc.lines[
      Math.floor(
        Math.random()*npc.lines.length
      )
    ];

}


function closeDialog(){

  document.getElementById(
    "dialog"
  ).style.display="none";

}


/* =========================================================
   DIA / NOITE
========================================================= */

function updateClock(){

  if(
    Date.now()-lastTime<900
  ){

    return;

  }


  lastTime=Date.now();


  minute+=10;


  if(minute>=60){

    minute=0;
    hour++;

  }


  if(hour>=22){

    nextDay();

  }

}


/* =========================================================
   NOVO DIA
========================================================= */

function nextDay(){

  day++;

  hour=6;
  minute=0;

  energy=100;
  water=100;


  weather=
    Math.random()<0.25
    ?"rain"
    :"sun";


  for(
    const row of map
  ){

    for(
      const tile of row
    ){

      if(tile.crop){

        if(
          tile.watered
        ){

          tile.crop.growth++;


          if(
            tile.crop.growth>=1
          ){

            tile.crop.stage++;

            tile.crop.growth=0;

          }


          if(
            tile.crop.stage>3
          ){

            tile.crop.stage=3;

          }

        }


        if(
          weather==="rain"
        ){

          tile.watered=true;

        }

      }

    }

  }


  /*
    Bônus diário
  */

  seeds+=2;


  saveGame(false);


  if(weather==="rain"){

    toast(
      "🌧️ Dia "+
      day+
      " — está chovendo!"
    );

  }

  else{

    toast(
      "☀️ Dia "+
      day+
      " — bom dia!"
    );

  }

}


/* =========================================================
   SAVE
========================================================= */

function saveGame(show=true){

  if(!playing)return;


  const data={

    day,
    hour,
    minute,

    money,
    seeds,
    crops,
    fish,

    energy,
    water,

    weather,

    player,

    map

  };


  localStorage.setItem(
    "vale_verde_v4",
    JSON.stringify(data)
  );


  if(show){

    toast("💾 Jogo salvo!");

  }

}


/* =========================================================
   LOAD
========================================================= */

function loadGame(){

  const raw=
    localStorage.getItem(
      "vale_verde_v4"
    );


  if(!raw){

    toast(
      "Nenhum jogo salvo."
    );

    return;

  }


  const data=
    JSON.parse(raw);


  day=data.day;
  hour=data.hour;
  minute=data.minute;

  money=data.money;
  seeds=data.seeds;
  crops=data.crops;
  fish=data.fish;

  energy=data.energy;
  water=data.water;

  weather=data.weather;

  player=data.player;

  map=data.map;


  /*
    NPCS novamente
  */

  createNPCs();


  animals=[

    {
      type:"chicken",
      x:19*TILE,
      y:38*TILE,
      d:1,
      t:0
    },

    {
      type:"chicken",
      x:23*TILE,
      y:40*TILE,
      d:-1,
      t:50
    },

    {
      type:"cow",
      x:27*TILE,
      y:39*TILE,
      d:1,
      t:100
    }

  ];


  document.getElementById(
    "menu"
  ).style.display="none";


  playing=true;


  toast(
    "🌿 Jogo carregado!"
  );

}


/* =========================================================
   NPC FACTORY
========================================================= */

function createNPCs(){

  npcs=[

    {
      name:"Lia",
      x:44*TILE,
      y:22*TILE,
      shirt:"#c76c89",
      hair:"#57362a",

      lines:[
        "O Vale Verde fica lindo no fim da tarde.",
        "Cuide bem das suas plantações!",
        "O lago é ótimo para pescar."
      ]

    },

    {
      name:"Theo",
      x:49*TILE,
      y:27*TILE,
      shirt:"#5b7ec4",
      hair:"#35251f",

      lines:[
        "Dizem que existe um peixe enorme no lago.",
        "Pesque de manhã para ter mais sorte.",
        "Se quiser dinheiro, venda seus peixes."
      ]

    },

    {
      name:"Rosa",
      x:40*TILE,
      y:28*TILE,
      shirt:"#9367ba",
      hair:"#503225",

      lines:[
        "A cidade sempre tem alguma novidade.",
        "Plante bastante antes da chuva.",
        "Uma boa fazenda começa com paciência."
      ]

    }

  ];

}


/* =========================================================
   NOVO JOGO
========================================================= */

function newGame(){

  document.getElementById(
    "menu"
  ).style.display="none";


  day=1;
  hour=6;
  minute=0;

  money=100;
  seeds=8;
  crops=0;
  fish=0;

  energy=100;
  water=100;

  weather="sun";


  player={
    x:14*TILE,
    y:27*TILE,
    dir:"down",
    walk:false,
    frame:0
  };


  buildWorld();


  playing=true;


  toast(
    "🌱 Bem-vindo ao Vale Verde!"
  );

}


/* =========================================================
   INVENTÁRIO
========================================================= */

function select(index){

  selected=index;


  for(
    let i=0;
    i<6;
    i++
  ){

    document
      .getElementById("s"+i)
      .classList
      .toggle(
        "sel",
        i===index
      );

  }

}


/* =========================================================
   DESENHO BÁSICO
========================================================= */

function rect(
  px,
  py,
  width,
  height,
  color
){

  ctx.fillStyle=color;

  ctx.fillRect(
    Math.floor(px),
    Math.floor(py),
    Math.ceil(width),

/* =========================================================
   PARTICULAS
========================================================= */

function particle(
  px,
  py,
  text
){

  particles.push({

    x:px,
    y:py,

    text:text,

    life:45

  });

}


function drawParticles(){

  for(
    const p of particles
  ){

    p.y-=0.25;


    p.life--;


    ctx.font="8px Arial";

    ctx.textAlign="center";

    ctx.fillStyle="#fff";


    ctx.fillText(
      p.text,
      p.x-camera.x,
      p.y-camera.y
    );

  }


  particles=
    particles.filter(
      p=>p.life>0
    );

}


/* =========================================================
   ILUMINAÇÃO
========================================================= */

function lighting(){

  let darkness=0;


  /*
    noite
  */

  if(hour>=18){

    darkness=
      Math.min(
        0.48,
        (hour-18)*0.12
      );

  }


  if(hour<6){

    darkness=0.42;

  }


  if(darkness>0){

    rect(
      0,
      0,
      WIDTH,
      HEIGHT,
      "rgba(12,19,45,"+
      darkness+
      ")"
    );


    /*
      lua
    */

    ctx.fillStyle="#eee8bd";

    ctx.beginPath();

    ctx.arc(
      430,
      35,
      9,
      0,
      Math.PI*2
    );

    ctx.fill();


    /*
      estrelas
    */

    ctx.fillStyle="#fff";

    for(
      let i=0;
      i<22;
      i++
    ){

      rect(
        (i*73)%WIDTH,
        (i*31)%120,
        1,
        1,
        "#fff"
      );

    }

  }


  /*
    pôr do sol
  */

  if(
    hour>=17 &&
    hour<19
  ){

    rect(
      0,
      0,
      WIDTH,
      HEIGHT,
      "rgba(235,130,75,0.12)"
    );

  }

}

/* =========================================================
   RENDERIZAÇÃO DO MAPA
========================================================= */

function draw(){

  ctx.clearRect(
    0,
    0,
    WIDTH,
    HEIGHT
  );


  /*
    câmera segue personagem
  */

  camera.x=Math.max(
    0,
    Math.min(
      MAP_WIDTH*TILE-WIDTH,
      player.x-WIDTH/2
    )
  );


  camera.y=Math.max(
    0,
    Math.min(
      MAP_HEIGHT*TILE-HEIGHT,
      player.y-HEIGHT/2
    )
  );


  const startX=
    Math.floor(camera.x/TILE)-1;

  const startY=
    Math.floor(camera.y/TILE)-1;

  const endX=
    Math.ceil(
      (camera.x+WIDTH)/TILE
    )+1;

  const endY=
    Math.ceil(
      (camera.y+HEIGHT)/TILE
    )+1;


  /*
    tiles
  */

  for(
    let y=startY;
    y<endY;
    y++
  ){

    for(
      let x=startX;
      x<endX;
      x++
    ){

      if(
        x<0 ||
        y<0 ||
        x>=MAP_WIDTH ||
        y>=MAP_HEIGHT
      ){

        continue;

      }


      const tile=
        map[y][x];


      const px=
        x*TILE-camera.x;

      const py=
        y*TILE-camera.y;


      switch(tile.type){

        case"grass":

          drawGrass(
            px,
            py,
            tile.variant
          );

        break;


        case"soil":

          drawSoil(
            px,
            py
          );

        break;


        case"path":

          drawPath(
            px,
            py
          );

        break;


        case"water":

          drawWater(
            px,
            py
          );

        break;


        case"tree":

          drawGrass(
            px,
            py,
            tile.variant
          );

          drawTree(
            px,
            py
          );

        break;


        case"rock":

          drawGrass(
            px,
            py,
            tile.variant
          );

          drawRock(
            px,
            py
          );

        break;


        case"flower":

          drawGrass(
            px,
            py,
            tile.variant
          );

          drawFlower(
            px,
            py
          );

        break;


        case"house":

          drawHouse(
            px,
            py
          );

        break;


        case"door":

          drawDoor(
            px,
            py
          );

        break;

      }


      /*
        plantação
      */

      if(tile.crop){

        drawCrop(
          tile,
          px,
          py
        );

      }

    }

  }


  /*
    personagens
  */

  npcs.forEach(
    drawNPC
  );


  /*
    animais
  */

  animals.forEach(
    drawAnimal
  );


  /*
    jogador
  */

  drawPlayer();


  /*
    partículas
  */

  drawParticles();


  /*
    chuva
  */

  if(weather==="rain"){

    drawRain();

  }


  /*
    iluminação
  */

  lighting();

}


/* =========================================================

========================================================= */

function updateHUD(){

  document.getElementById(
    "day"
  ).textContent=day;


  document.getElementById(
    "clock"
  ).textContent=
    String(hour).padStart(2,"0")
    +":"+
    String(minute).padStart(2,"0");


  document.getElementById(
    "money"
  ).textContent=money;


  document.getElementById(
    "seeds"
  ).textContent=seeds;


  document.getElementById(
    "crops"
  ).textContent=crops;


  document.getElementById(
    "fish"
  ).textContent=fish;


  document.getElementById(
    "energy"
  ).style.width=
    Math.max(
      0,
      energy
    )+"%";


  document.getElementById(
    "water"
  ).style.width=
    Math.max(
      0,
      water
    )+"%";


  document.getElementById(
    "weather"
  ).textContent=
    weather==="rain"
    ?"🌧️ Chuva"
    :"☀️ Ensolarado";


  document.querySelector(
    "#s0 small"
  ).textContent=seeds;


  document.querySelector(
    "#s1 small"
  ).textContent=crops;


  document.querySelector(
    "#s5 small"
  ).textContent=fish;

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;


function toast(text){

  const element=
    document.getElementById(
      "toast"
    );


  element.textContent=text;

  element.style.display="block";


  clearTimeout(
    toastTimer
  );


  toastTimer=
    setTimeout(
      ()=>{
        element.style.display="none";
      },
      2000
    );

}


/* =========================================================
   LOOP PRINCIPAL
========================================================= */

function gameLoop(){

  tick++;


  if(playing){

    updatePlayer();

    updateAnimals();

    updateClock();

    draw();

    updateHUD();

  }


  requestAnimationFrame(
    gameLoop
  );

}


/* =========================================================
   AUTO SAVE
========================================================= */

setInterval(
  ()=>{
    if(playing){
      saveGame(false);
    }
  },
  30000
);


/* =========================================================
   START
========================================================= */

gameLoop();
